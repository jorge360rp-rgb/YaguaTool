<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yaguano · Revisión visual</title><style>body{margin:24px;background:#101216;color:#eef3fa;font:15px system-ui}a{color:#66c2ff}select{padding:10px;background:#1c1f26;color:white;border:1px solid #444;border-radius:10px}img{display:block;max-width:100%;margin-top:20px;border:1px solid #444;border-radius:10px}p{max-width:800px;line-height:1.6}</style><h1>Yaguano · Referencia visual</h1><p>Propuesta independiente, sin conexión a AE. <a href="../mock/index.html">Abrir propuesta interactiva</a> · <a href="INFORME.md">Informe de revisión</a></p><label>Pantalla <select id="screen"></select></label> <label>Ancho <select id="width"><option>240</option><option>320</option><option>420</option><option selected>1000</option></select></label><img id="capture" alt="Captura de la propuesta"><script>const items={text:'Texto','motion-lab':'Motion Lab',complex:'Complex',library:'Biblioteca',carrousel:'Carrousel',motion:'Movimiento',backgrounds:'Fondos',graph:'Curvas',tools:'Herramientas','tools-shapes':'Herramientas formas','tools-code':'Scripts',saved:'Guardado',grid:'Retícula',dynamicgrid:'Grid Pro',settings:'Ajustes'};const screen=document.getElementById('screen'),width=document.getElementById('width');Object.keys(items).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=items[k];screen.append(o)});function paint(){document.getElementById('capture').src=screen.value+'-'+width.value+'.png'}screen.onchange=width.onchange=paint;paint();</script></html>
